name: tekshiruv

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tekshir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repo tekshiruvi (kirill + manifest + komponentlar)
        run: node scripts/tekshir.js

      - name: Hook skripti sintaksisi
        run: node --check hooks/hisobot-qorovul.js
